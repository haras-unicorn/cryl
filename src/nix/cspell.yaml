# yaml-language-server: $schema=https://raw.githubusercontent.com/streetsidesoftware/cspell/refs/heads/main/cspell.schema.json
useGitignore: true
version: "0.2"
language: en
ignoreWords:
  - pkgs
  - clippy
  - nixfmt
  - mdbook
  - taplo
  - langservers
  - mkpasswd
  - libargon
  - shellcheck
  - markdownignore
  - attrset
  - rustc
  - naersk
  - pname
  - sshpass
  - nixos
  - vhost
  - vsock
  - virtualisation
  - stdenv
